name: ci-ubuntu-3.11

# One cell of the README badge matrix: ubuntu x Python 3.11. The steps live in test.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      os: ubuntu-latest
      python: "3.11"
